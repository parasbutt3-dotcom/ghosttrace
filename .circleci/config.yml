version: 2.1

orbs:
  python: circleci/python@2.1.1
  node: circleci/node@5.2.0

jobs:
  backend:
    docker:
      - image: cimg/python:3.12
      - image: postgres:16
        environment:
          POSTGRES_USER: ghosttrace
          POSTGRES_PASSWORD: ghosttrace
          POSTGRES_DB: ghosttrace
    environment:
      DATABASE_URL: postgresql+psycopg2://ghosttrace:ghosttrace@localhost:5432/ghosttrace
      SECRET_KEY: test-secret-key-32chars-minimum-aaaa
      TOKEN_ENCRYPTION_KEY: QFJ-zhAIHeDkTDc8kPgFgjHhMbDO6u6_gc5XSfw69oI=
      AUTO_SYNC_ENABLED: "false"
      APP_ENV: development
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: pip
          app-dir: backend
      - run:
          name: Run tests
          working_directory: backend
          command: python -m pytest -q
      - run:
          name: Ruff
          working_directory: backend
          command: python -m ruff check app
      - run:
          name: Mypy
          working_directory: backend
          command: python -m mypy app --ignore-missing-imports
      - run:
          name: Import check
          working_directory: backend
          command: python -c "import app.main; print('import ok')"

  frontend:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - node/install-packages:
          app-dir: frontend
          override-ci-command: npm ci
      - run:
          name: Lint
          working_directory: frontend
          command: npm run lint
      - run:
          name: Unit tests
          working_directory: frontend
          command: npm test -- --run
      - run:
          name: Build
          working_directory: frontend
          command: npm run build

  android:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout
      - run:
          name: Make gradlew executable
          command: chmod +x android/gradlew
      - run:
          name: Assemble debug APK
          working_directory: android
          command: ./gradlew assembleDebug

workflows:
  build-and-test:
    jobs:
      - backend
      - frontend
      - android
