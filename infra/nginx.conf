# GHOSTTRACE — production nginx reverse proxy
# TLS termination + routing to the backend (FastAPI :8000) and frontend (Next.js :3000).
#
# Replace every occurrence of `ghosttrace.example.com` with your real domain before
# deploying. Certificate paths follow the certbot layout (see docs/deployment.md).

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    # --- upstreams -----------------------------------------------------------
    upstream ghosttrace_backend {
        server backend:8000;
        keepalive 32;
    }

    upstream ghosttrace_frontend {
        server frontend:3000;
        keepalive 32;
    }

    # --- shared proxy settings ----------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;

    # --- HTTP: ACME challenge + redirect to HTTPS ---------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name ghosttrace.example.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS --------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name ghosttrace.example.com;

        ssl_certificate /etc/letsencrypt/live/ghosttrace.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ghosttrace.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security headers — mirror backend/app/main.py security_headers middleware.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Backend health / docs / API
        location = /health {
            proxy_pass http://ghosttrace_backend;
        }

        location = /ready {
            proxy_pass http://ghosttrace_backend;
        }

        location ^~ /api/ {
            proxy_pass http://ghosttrace_backend;
            # API responses are JSON; keep the app's restrictive CSP.
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        }

        location ^~ /docs {
            proxy_pass http://ghosttrace_backend;
        }

        location = /openapi.json {
            proxy_pass http://ghosttrace_backend;
        }

        # Everything else -> Next.js frontend
        location / {
            proxy_pass http://ghosttrace_frontend;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Frontend needs a looser CSP than the JSON API.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'" always;
        }
    }
}
