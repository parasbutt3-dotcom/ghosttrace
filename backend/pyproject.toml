[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# FastAPI dependency injection uses function calls in argument defaults by design.
ignore = ["B008", "BLE001", "S110"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy forward references to models that are defined elsewhere.
"app/models/*.py" = ["F821"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
# Keep checks meaningful but don't fail on third-party / framework internals.
disallow_untyped_defs = false
check_untyped_defs = true