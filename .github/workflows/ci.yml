name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ghosttrace
          POSTGRES_PASSWORD: ghosttrace
          POSTGRES_DB: ghosttrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghosttrace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://ghosttrace:ghosttrace@localhost:5432/ghosttrace
      SECRET_KEY: test-secret-key-32chars-minimum-aaaa
      TOKEN_ENCRYPTION_KEY: QFJ-zhAIHeDkTDc8kPgFgjHhMbDO6u6_gc5XSfw69oI=
      AUTO_SYNC_ENABLED: "false"
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - working-directory: backend
        run: python -m pytest -q
      - working-directory: backend
        run: python -c "import app.main; print('import ok')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run build

  ios-typecheck:
    # Compiles the companion sources on real Apple hardware.
    # UIKit-only paths are behind #if canImport(UIKit); CoreLocation,
    # EventKit and Network exist on macOS, so the same files type-check
    # against the macOS SDK — catching syntax/API errors without a Mac.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Type-check iOS companion
        run: |
          xcrun swiftc -typecheck ios/*.swift